            flex-direction: column;
            justify-content: flex-start;

            text-align: center;

        }

            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 350px;
        }

        /* বেসিক বাটন স্টাইল */
        .btn {
            color: #ffffff;
            border: none;
            padding: 18px 20px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: transform 0.2s ease, filter 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        /* প্রতিটি বাটনের নিজস্ব রঙ */
